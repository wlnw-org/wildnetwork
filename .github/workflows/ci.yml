name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      # Tests never connect; modules that import the db client only need a URL to load.
      - run: pnpm test
        env:
          DATABASE_URL: postgres://test@127.0.0.1:1/test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install duckdb && python -m unittest scripts/test_aws_export.py
